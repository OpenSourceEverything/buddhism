<h2>Text</h2>
<pre>Dhp 377
Translated by Bhikkhu Sujato
Source: https://suttacentral.net/dhp377/en/sujato
License: CC0-1.0

As a jasmine sheds
its withered flowers,
O mendicants,
shed greed and hate.
